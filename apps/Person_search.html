<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarCite | Dr. Manuel D. S. Hopp</title>
    <meta name="description" content="Multi-Source Academic Profile & Citation Explorer. Search OpenAlex and Semantic Scholar, merge author profiles, and generate APA 7th citations.">

    <!-- Fonts (self-hosted) -->
    <link rel="stylesheet" href="../assets/css/app-fonts.css">


    <!-- React & ReactDOM (vendored) -->
    <script src="../assets/vendor/react/react.production.min.js"></script>
    <script src="../assets/vendor/react/react-dom.production.min.js"></script>

    <style>
        :root {
            --color-accent: #f86116;
            --color-accent-text: #b83b05;
            --body-shine: radial-gradient(ellipse 100% 50% at 50% 0%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0) 70%), radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.8) 0%, transparent 45%), radial-gradient(circle at 15% 85%, rgba(255, 255, 255, 0.5) 0%, transparent 40%), linear-gradient(135deg, #eef2f6 0%, #e2e8f0 14%, #f8fafc 28%, #ffffff 40%, #e5ecf3 52%, #f9fbfd 66%, #e0e8f1 80%, #edf3f8 100%);
            --color-accent-deep: #b83b05;
            --color-bg: #f1f5f9;
            --color-surface: #ffffff;
            --color-border: #dbe3ec;
            --color-text-main: #1e293b;
        }
        .dark {
            --color-accent-text: #fb7c3c;
            --body-shine: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(30, 58, 95, 0.18) 0%, transparent 70%), linear-gradient(145deg, #0a0f15 0%, #0d141f 40%, #0a0f15 100%);
            --color-bg: #0a0f15;
            --color-surface: #101822;
            --color-border: #16222f;
            --color-text-main: #e2e8f0;
        }
        body {
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--color-bg);
            background-image: var(--body-shine);
            background-attachment: fixed;
            color: var(--color-text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .apa-citation em { font-style: italic; }
        .glass-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 14px;
            box-shadow: 0 8px 32px 0 rgba(100, 125, 155, 0.08), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .dark .glass-card {
            background: rgba(16, 24, 34, 0.72);
            border: 1px solid rgba(80, 115, 155, 0.22);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
        }
        .dark .glass-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        .keyword-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.015em;
            border-left: 2px solid #f86116;
            background: rgba(248, 97, 22, 0.08);
            color: #8f2e03;
            border-radius: 0px;
        }
        .dark .keyword-tag {
            background: rgba(248, 97, 22, 0.18);
            color: #fb7c3c;
        }
        .skill-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.015em;
            border-left: 2px solid #8ba0b5;
            background: rgba(140, 165, 195, 0.10);
            color: #334e68;
            border-radius: 0px;
        }
        .dark .skill-tag {
            background: rgba(90, 125, 165, 0.14);
            color: #9bb2c9;
        }
        .btn-editorial {
            border-radius: 0px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .btn-editorial:active {
            transform: scale(0.98);
        }
    </style>
    <!-- Tailwind, precompiled (apps/src/build.sh); last so it keeps the cascade order of the former runtime CDN -->
    <link rel="stylesheet" href="../assets/css/tailwind-person-search.css">
</head>
<body class="min-h-screen flex flex-col">

    <div id="root"></div>

    <script src="../assets/js/person-search.js"></script>
</body>
</html>
